<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-info">
                <span class="icon">👁</span>
                <span class="number">1,234</span>
            </div>
            <p class="card-about">Views</p>
            <p class="koff">+12%</p>
        </div>
        
        <div class="card">
            <div class="card-info">
                <span class="icon">💬</span>
                <span class="number">1,234</span>
            </div>
            <p class="card-about">Comments</p>
            <p class="koff">+12%</p>
        </div>

        <div class="card">
            <div class="card-info">
                <span class="icon">❤</span>
                <span class="number">1,234</span>
            </div>
            <p class="card-about">Likes</p>
            <p class="koff">+12%</p>
        </div>

    </div>
</body>
</html>
