<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header_found">
            <p class="logo">🔍</p>
            <input placeholder="Search" type="text">
        </div>
        <div class="header_menu">
            <a href="#">Library</a>
            <a href="#">Liked</a>
            <a href="#">Settings</a>
        </div>
    </header>

    <main class="main">
        <aside class="playlist">
            <div class="playlist_title">
                <p>PLAYLIST</p>
            </div>
            <div class="playlist_list">
                <a href="#" class="song">♫ Song 1</a>
                <a href="#" class="song">♫ Song 2</a>
                <a href="#" class="song">♫ Song 3</a>
                <a href="#" class="song">♫ Song 4</a>
                <a href="#" class="song">♫ Song 5</a>
                <a href="#" class="song song--active">♫ Song 6</a>
                <a href="#" class="song">♫ Song 7</a>
                <a href="#" class="song">♫ Song 8</a>
                <a href="#" class="song">♫ Song 9</a>
                <a href="#" class="song">♫ Song 10</a>
                <a href="#" class="song">♫ Song 11</a>
                <a href="#" class="song">♫ Song 12</a>
                <a href="#" class="song">♫ Song 13</a>
                <a href="#" class="song">♫ Song 14</a>
            </div>
        </aside>
        <div class="content">
            <div class="content_title">
                <p>NOW PLAYING</p>
            </div>
            <div class="content_img">
                <img src="../img/enderman4.png" alt="song">
            </div>
            <div class="content_info">
                <div class="name">
                    <p>Song Name</p> 
                </div>
                <div class="artist">
                    <p>Artist Name</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
